[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alphapulldown-dnaaf-screen"
version = "0.0.0"
description = "Planning repository for a reproducible AlphaPulldown DNAAF-ODA-IFT interaction screen."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "License not yet selected" }
authors = [{ name = "Medha Sharma" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

